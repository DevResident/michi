name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    env:
      MICHI_KEYSTORE_BASE64: ${{ secrets.MICHI_KEYSTORE_BASE64 }}
      MICHI_KEYSTORE_PASSWORD: ${{ secrets.MICHI_KEYSTORE_PASSWORD }}
      MICHI_KEY_ALIAS: ${{ secrets.MICHI_KEY_ALIAS }}
      MICHI_KEY_PASSWORD: ${{ secrets.MICHI_KEY_PASSWORD }}
      MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
      ANILIST_CLIENT_ID: ${{ secrets.ANILIST_CLIENT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify the tag is on main
        run: |
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points to $GITHUB_SHA, which is not an ancestor of origin/main. Release tags must be created on main."
            exit 1
          fi

      - name: Check required secrets
        run: |
          required=(
            MICHI_KEYSTORE_BASE64
            MICHI_KEYSTORE_PASSWORD
            MICHI_KEY_ALIAS
            MICHI_KEY_PASSWORD
            MAL_CLIENT_ID
            ANILIST_CLIENT_ID
          )
          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::Missing required repository secrets: ${missing[*]}"
            exit 1
          fi

      - name: Decode release keystore
        run: |
          umask 077
          printf '%s' "$MICHI_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "MICHI_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build signed release
        run: ./gradlew :androidApp:assembleRelease :androidApp:bundleRelease --stacktrace

      - name: Resolve release notes
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          major_minor="${version%.*}"
          notes="docs/release-notes-${major_minor}.md"
          if [ -f "$notes" ]; then
            echo "path=$notes" >> "$GITHUB_OUTPUT"
          else
            printf 'Release %s\n' "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
            echo "path=$RUNNER_TEMP/release-notes.md" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Michi ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          fail_on_unmatched_files: true
          files: |
            androidApp/build/outputs/apk/release/*.apk
            androidApp/build/outputs/bundle/release/*.aab
