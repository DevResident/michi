name: Release

on:
  push:
    tags:
      # GitHub tag patterns are globs: [0-9]+ matches one or more digits.
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify the tag is on main
        run: |
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points to $GITHUB_SHA, which is not an ancestor of origin/main. Release tags must be created on main."
            exit 1
          fi

      - name: Check required secrets
        env:
          MICHI_KEYSTORE_BASE64: ${{ secrets.MICHI_KEYSTORE_BASE64 }}
          MICHI_KEYSTORE_PASSWORD: ${{ secrets.MICHI_KEYSTORE_PASSWORD }}
          MICHI_KEY_ALIAS: ${{ secrets.MICHI_KEY_ALIAS }}
          MICHI_KEY_PASSWORD: ${{ secrets.MICHI_KEY_PASSWORD }}
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
          ANILIST_CLIENT_ID: ${{ secrets.ANILIST_CLIENT_ID }}
        run: |
          required=(
            MICHI_KEYSTORE_BASE64
            MICHI_KEYSTORE_PASSWORD
            MICHI_KEY_ALIAS
            MICHI_KEY_PASSWORD
            MAL_CLIENT_ID
            ANILIST_CLIENT_ID
          )
          missing=()
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::Missing required repository secrets: ${missing[*]}"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3.5.0

      - name: Verify the tag matches versionName
        run: |
          version="$(./gradlew -q printVersion -PrequireTagVersion=true | tail -n 1)"
          if [ "$version" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName '$version'. Create the tag on the commit the version resolves to."
            exit 1
          fi

      - name: Decode release keystore
        env:
          MICHI_KEYSTORE_BASE64: ${{ secrets.MICHI_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$MICHI_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Test, lint and build signed release
        env:
          MICHI_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          MICHI_KEYSTORE_PASSWORD: ${{ secrets.MICHI_KEYSTORE_PASSWORD }}
          MICHI_KEY_ALIAS: ${{ secrets.MICHI_KEY_ALIAS }}
          MICHI_KEY_PASSWORD: ${{ secrets.MICHI_KEY_PASSWORD }}
          MAL_CLIENT_ID: ${{ secrets.MAL_CLIENT_ID }}
          ANILIST_CLIENT_ID: ${{ secrets.ANILIST_CLIENT_ID }}
        run: |
          ./gradlew -p buildSrc test --stacktrace
          ./gradlew :shared:testAndroidHostTest :androidApp:lintRelease -PrequireTagVersion=true --stacktrace
          ./gradlew :androidApp:assembleRelease :androidApp:bundleRelease -PrequireTagVersion=true --stacktrace
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Resolve release notes
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          major_minor="${version%.*}"
          notes="docs/release-notes-${major_minor}.md"
          if [ -f "$notes" ]; then
            echo "path=$notes" >> "$GITHUB_OUTPUT"
          else
            printf 'Release %s\n' "$GITHUB_REF_NAME" > "$RUNNER_TEMP/release-notes.md"
            echo "path=$RUNNER_TEMP/release-notes.md" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          name: Michi ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          fail_on_unmatched_files: true
          files: |
            androidApp/build/outputs/apk/release/*.apk
            androidApp/build/outputs/bundle/release/*.aab
