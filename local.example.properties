sdk.dir=

# AniList API
# Register your app at https://anilist.co/settings/developer
# Redirect URI must be set to: michi://oauth/callback
anilistClientId=
# Token de test
anilistTestToken=

# MyAnimeList API (optional; without it the MAL login button is hidden)
# Register your app at https://myanimelist.net/apiconfig
# Redirect URI must be set to: michi://oauth/callback
malClientId=

# Optional sponsor link shown as "Support the project"; leave empty to hide it.
# Can also be set with MICHI_SPONSOR_URL in CI.
sponsorUrl=
